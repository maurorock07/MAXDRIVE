  <path d="M 28 16 L 24 27 L 27 27 L 31 16 Z" fill="#FFFFFF" opacity="0.45"/>

  <!-- Hood Character Contours -->
  <path d="M 17 28 L 20 37.5 L 44 37.5 L 47 28" fill="none" stroke="#0E236B" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Modern Full-LED Headlights -->
  <!-- Left Headlight -->
  <path d="M 9.5 33.5 C 13 32.5 18 33 21.5 36 C 21.5 38.5 18 39.5 12 39.5 C 9.5 39.5 8.5 37 9.5 33.5 Z" fill="#FFFFFF"/>
  <path d="M 9.5 33.5 C 13.5 32.5 18 33 21.5 36" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right Headlight -->
  <path d="M 54.5 33.5 C 51 32.5 46 33 42.5 36 C 42.5 38.5 46 39.5 52 39.5 C 54.5 39.5 55.5 37 54.5 33.5 Z" fill="#FFFFFF"/>
  <path d="M 54.5 33.5 C 50.5 32.5 46 33 42.5 36" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- MAX DRIVE Yellow Brand Accent on Center -->
  <polygon points="32,33.5 34.5,36.5 32,39.5 29.5,36.5" fill="#FEE500"/>

  <!-- Lower Sport Grille & Aerodynamic Bumper -->
  <rect x="19" y="42" width="26" height="7.5" rx="3.5" fill="#020835"/>
