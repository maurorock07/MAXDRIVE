  <rect x="50.5" y="38" width="8.5" height="17" rx="4" fill="#020835"/>

  <!-- Aerodynamic Side Mirrors -->
  <path d="M 6.5 28 C 3.5 28 2.5 30.5 3.5 33 C 4.5 35 7 35 10 34.5 L 11 30 Z" fill="#07154D"/>
  <path d="M 57.5 28 C 60.5 28 61.5 30.5 60.5 33 C 59.5 35 57 35 54 34.5 L 53 30 Z" fill="#07154D"/>
  <!-- Mirror Glass Refraction -->
  <path d="M 4 32 C 4.5 30.5 6.5 29.5 9 30 L 9 33.5 Z" fill="#00E5FF" opacity="0.75"/>
  <path d="M 60 32 C 59.5 30.5 57.5 29.5 55 30 L 55 33.5 Z" fill="#00E5FF" opacity="0.75"/>

  <!-- Main Vehicle Body Shell (Clean Modern Silhouette) -->
  <path d="M 18 13.5
